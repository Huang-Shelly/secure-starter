openapi: 3.1.0
info:
  title: Secure Starter API
  version: 0.1.0
  description: 供 DAST（OWASP ZAP）與 API 模糊測試（Schemathesis）使用的 API 規格。新增端點時請同步更新。
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-sid
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            fields: { type: array, items: { type: object } }
    Note:
      type: object
      required: [id, title, body, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        updatedAt: { type: string, format: date-time }
  responses:
    Error:
      description: 錯誤
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
security:
  - session: []
paths:
  /api/health:
    get:
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
  /api/auth/me:
    get:
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "429": { $ref: "#/components/responses/Error" }
  /api/notes:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [notes]
                properties:
                  notes: { type: array, items: { $ref: "#/components/schemas/Note" } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, body]
              properties:
                # 伺服器會 trim 並拒絕 NUL 字元
                title: { type: string, minLength: 1, maxLength: 200, pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$' }
                body: { type: string, maxLength: 10000, pattern: '^[^\u0000]*$' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { type: object, required: [note], properties: { note: { $ref: "#/components/schemas/Note" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [note], properties: { note: { $ref: "#/components/schemas/Note" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/agent/pending:
    get:
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/agent/confirm:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, decision]
              properties:
                id: { type: string, format: uuid }
                decision: { type: string, enum: [approve, reject] }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/agent:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 4000, pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$' }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
