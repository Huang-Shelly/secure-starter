# 自動化攻擊測試：啟動完整應用程式後執行
#  1. API 模糊測試（Schemathesis，依 redteam/api/openapi.yaml）
#  2. DAST 被動掃描（OWASP ZAP Baseline，網頁）
#  3. DAST API 主動掃描（OWASP ZAP API Scan，依 OpenAPI）
# 只對 CI 內的臨時環境攻擊，絕不指向正式環境。
name: Red Team - DAST & API Fuzzing

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1" # 每週一
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:ci-only-password@localhost:5432/app
      NODE_ENV: production
      APP_ORIGIN: https://localhost:3000
      WEBAUTHN_RP_ID: localhost
      # 只在這個臨時測試環境放寬速率限制，讓模糊測試能打到業務邏輯
      RATE_LIMIT_SCALE: "100"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx prisma generate && npx prisma migrate deploy
      - run: npm run build
      - name: 啟動應用程式
        run: |
          nohup npm start > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && exit 0; sleep 1; done
          cat app.log; exit 1
      # 這個 token 只屬於本次 CI 臨時資料庫中的測試帳號，工作結束即失效；遮蔽只是避免出現在日誌中
      - name: 建立測試 session
        # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command
        run: |
          TOKEN=$(ALLOW_TEST_SEED=1 node redteam/scripts/seed-test-session.mjs)
          echo "::add-mask::$TOKEN"
          echo "SESSION_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - run: mkdir -p reports

      - name: API 模糊測試（Schemathesis）
        run: |
          pip install schemathesis==4.33.4
          st --config-file redteam/api/schemathesis.toml run redteam/api/openapi.yaml \
            --url http://localhost:3000 --checks all --exclude-checks unsupported_method \
            --report junit,har --report-dir reports/schemathesis

      - name: DAST 被動掃描（ZAP Baseline）
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          rules_file_name: .zap/rules.tsv
          cmd_options: -a -j
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline

      - name: 準備 API 規格給 ZAP
        run: |
          nohup python3 -m http.server 8090 --directory redteam/api > /dev/null 2>&1 &
          sleep 1

      - name: DAST API 主動掃描（ZAP API Scan）
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: http://localhost:8090/openapi.yaml
          format: openapi
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-api-scan
          # 以替換器帶入測試 session 與同源 Origin，讓主動掃描能打到需要登入的端點
          cmd_options: >-
            -a -z "-config replacer.full_list(0).description=session
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=Cookie
            -config replacer.full_list(0).regex=false
            -config replacer.full_list(0).replacement=__Host-sid=${{ env.SESSION_TOKEN }}
            -config replacer.full_list(1).description=origin
            -config replacer.full_list(1).enabled=true
            -config replacer.full_list(1).matchtype=REQ_HEADER
            -config replacer.full_list(1).matchstr=Origin
            -config replacer.full_list(1).regex=false
            -config replacer.full_list(1).replacement=https://localhost:3000"

      - name: 檢查伺服器日誌是否有未處理錯誤
        if: always()
        run: |
          if grep -q '"route.unhandled"' app.log; then
            echo "::error::發現未處理的伺服器錯誤"; grep '"route.unhandled"' app.log | head -20; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: redteam-reports
          path: |
            reports/
            app.log
          retention-days: 30
